[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-drive-cli"
version = "0.1.0"
description = "Cross-platform CLI for Quark Drive file management"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = ["httpx>=0.27,<1", "qrcode[pil]>=7.4,<9"]

[project.optional-dependencies]
test = ["zxing-cpp>=2.2,<4"]

[project.scripts]
quark = "quark_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
