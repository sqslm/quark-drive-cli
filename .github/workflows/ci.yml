name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: CLI smoke check
        run: |
          quark --version
          quark --help
          python -m pip check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile, zipfile
          wheel, = Path('dist').glob('*.whl')
          source, = Path('dist').glob('*.tar.gz')
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(n.endswith('/licenses/LICENSE') for n in names)
              assert not any(n.endswith(('.exe', '.dll', '.pyc')) for n in names)
          with tarfile.open(source) as archive:
              names += archive.getnames()
              assert any(n.endswith('/tests/__init__.py') for n in names)
              assert any(n.endswith('/potplayer/icons/LICENSE-lucide.txt') for n in names)
          assert not any(set(n.split('/')) & {'tmp', 'build', '.env', '__pycache__'} for n in names)
          PY
      - name: Verify wheel outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --upgrade pip
          wheel-smoke/bin/python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl
          wheel-smoke/bin/python -m pip check
          wheel-smoke/bin/quark --version
          wheel-smoke/bin/quark --help
          wheel-smoke/bin/python -m quark_cli --help
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --skip-editable
